name: Build installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path app/version.py -Value "__version__ = `"$v`"" -Encoding utf8
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean isle.spec
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Установщик
        shell: pwsh
        run: |
          $v = python -c "from app.version import __version__ as v; print(v)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\isle.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Isle-Setup
          path: dist/Isle-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/Isle-Setup-*.exe
